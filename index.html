<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffdfe6">
<title>มีเรื่องอยากบอกพี่</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#6b4f5a;--pink:#ff8fa3;--pink2:#d9728b;--pinkL:#fff0f3;--line:#ffd3dc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;font-family:'Mali','Sarabun','Noto Sans Thai',sans-serif;color:var(--ink);overflow-x:hidden;background:#fff1e8}

/* พื้นหลังเปลี่ยนสีตามฉาก + เมฆ + ประกาย */
.tints i{position:fixed;inset:0;opacity:0;transition:opacity 1.1s;z-index:0}
.tints i.on{opacity:1}
.tints .t0{background:linear-gradient(170deg,#fff1e8,#ffdfe6 60%,#ffe9d2)}
.tints .t1{background:linear-gradient(170deg,#f3ebff,#e3dcff 55%,#ffe3ee)}
.tints .t2{background:linear-gradient(170deg,#fff8dc,#ffe8c4 55%,#ffdfe6)}
.tints .t3{background:linear-gradient(170deg,#ffe3ec,#ffc9d9 55%,#f3e3ff)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky .st{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite}
#sky .cl{position:absolute;left:-30vw;height:34px;border-radius:99px;background:rgba(255,255,255,.75);animation:cloud linear infinite}
#sky .cl::before,#sky .cl::after{content:"";position:absolute;background:inherit;border-radius:50%}
#sky .cl::before{width:44%;height:150%;left:14%;bottom:30%}
#sky .cl::after{width:34%;height:120%;right:16%;bottom:30%}
@keyframes cloud{to{transform:translateX(160vw)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

.app{position:relative;z-index:2;margin:0 auto;width:min(100vw,440px);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 16px)}
.top{text-align:center}
.hearts{display:flex;justify-content:center;gap:9px;margin-bottom:10px;height:22px;align-items:center}
.hearts i{font-style:normal;font-size:14px;color:#f1d3dc;transition:all .4s}
.hearts i.done{color:#ffb3c1}
.hearts i.on{color:var(--pink);transform:scale(1.55);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.8)}}
.tag{display:inline-block;font-weight:700;font-size:.82rem;line-height:1.8;color:var(--pink2);background:#fff;border:2px solid var(--line);padding:2px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(225,120,150,.15)}

/* กรอบคำพูด */
.say{margin-top:16px;min-height:196px;display:flex;align-items:flex-end;transition:opacity .22s}
.bubble{position:relative;width:100%;background:#fff;border:2px solid var(--line);border-radius:30px;padding:20px 20px;box-shadow:0 14px 30px rgba(225,120,150,.26),inset 0 -5px 0 #ffeef1;transform-origin:50% 100%;animation:bubIn .55s cubic-bezier(.2,1.5,.4,1) backwards;cursor:pointer}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;width:26px;height:26px;margin-left:-13px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0 0 9px 0;transform:rotate(45deg)}
@keyframes bubIn{0%{transform:scale(.5) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
.msg{font-weight:700;font-size:1.06rem;line-height:2.05;white-space:pre-line;text-align:center}
.msg .ghost{visibility:hidden}

/* น้องแมว */
.cat{position:relative;flex:1;min-height:210px;margin-top:26px;display:flex;align-items:center;justify-content:center;transition:opacity .22s}
.cat .floor{position:absolute;bottom:6%;left:50%;width:58%;height:20px;margin-left:-29%;border-radius:50%;background:radial-gradient(rgba(190,110,130,.3),transparent 70%)}
.cat img{position:relative;height:min(36vh,260px);max-width:86%;object-fit:contain;cursor:pointer;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 8px 8px rgba(190,110,130,.22));animation:catIn .7s cubic-bezier(.3,1.5,.5,1) backwards,bob 3s ease-in-out .7s infinite}
.cat.squish img{animation:squish .45s cubic-bezier(.3,1.6,.5,1),bob 3s ease-in-out .45s infinite}
@keyframes catIn{0%{transform:translateY(60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.12,.86)}60%{transform:scale(.94,1.1)}100%{transform:scale(1)}}
.app.out .say,.app.out .cat{opacity:0}

.actions{min-height:116px;padding-top:6px;display:flex;flex-direction:column;align-items:center;gap:16px;transition:opacity .4s}
.actions.wait{opacity:0;pointer-events:none}
.hint{font-size:.76rem;line-height:1.8;color:#b79aa5;text-align:center;min-height:1.8em;margin-top:6px}

/* ปุ่มกลมป่องแบบโมจิ */
.btn{position:relative;overflow:hidden;font:inherit;font-weight:700;font-size:1rem;line-height:1.6;color:#fff;border:0;cursor:pointer;padding:12px 32px;border-radius:999px;
  background:linear-gradient(180deg,#ffb8c0,#ff8fa3);box-shadow:0 9px 18px rgba(255,120,150,.38),inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(214,80,115,.25);text-shadow:0 1px 2px rgba(180,60,95,.4);
  --s:1;transform:scale(var(--s));transition:transform .15s,box-shadow .12s,filter .15s;animation:wob 2.6s ease-in-out infinite}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes wob{0%,84%,100%{rotate:0deg}88%{rotate:-4deg}92%{rotate:4deg}96%{rotate:-2deg}}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px) scale(var(--s));box-shadow:0 4px 10px rgba(255,120,150,.35),inset 0 3px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(214,80,115,.25)}
.btn:focus-visible{outline:3px solid #ffd966;outline-offset:3px}
.btn.no{padding:9px 20px;font-size:.86rem;background:linear-gradient(180deg,#f3f3f7,#d9d9e2);color:#7b7a88;text-shadow:none;animation:none;box-shadow:0 6px 12px rgba(120,120,140,.22),inset 0 3px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(120,120,140,.14)}
.btn.no::after{display:none}
.btn.no.fly{position:fixed;z-index:5;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1)}
.foot{font-weight:700;font-size:.88rem;line-height:1.8;color:var(--pink2);background:#fff;border:2px solid var(--line);border-radius:22px;padding:8px 18px;text-align:center}
.again{border:0;background:transparent;color:#b79aa5;font:inherit;font-size:.78rem;line-height:1.8;cursor:pointer;text-decoration:underline}

.pop{position:fixed;z-index:4;width:72px;height:66px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(150,80,100,.3));animation:pop .8s forwards}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.fall{position:fixed;top:-30px;pointer-events:none;z-index:1;animation:fall linear forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(var(--sw),55vh,0) rotate(180deg)}100%{transform:translate3d(0,112vh,0) rotate(360deg)}}
.sparkle{position:fixed;z-index:7;pointer-events:none;font-size:14px;animation:spark .8s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(140deg);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-height:640px){.say{min-height:170px}.cat img{height:30vh}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fall,.sparkle,#confetti,#sky .cl{display:none}}
</style></head>
<body>
<div class="tints" aria-hidden="true"><i class="t0 on"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i></div>
<div id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="sr" id="sr" aria-live="polite"></div>

<main class="app" id="app">
  <header class="top"><div class="hearts" id="hearts" aria-hidden="true"></div><div class="tag" id="tag"></div></header>
  <section class="say" id="say"><div class="bubble" id="bubble"><p class="msg" id="msg" aria-hidden="true"></p></div></section>
  <section class="cat" id="catbox"><div class="floor"></div><img id="cat" alt="" draggable="false"></section>
  <section class="actions wait" id="actions"></section>
  <p class="hint" id="hint"></p>
</main>

<script>
/* ================= CONFIG: แก้ข้อความที่นี่ ================= */
const CONFIG = {
  /* คำแทนตัว — เปลี่ยนที่เดียว ใช้ได้ทั้งเว็บ: ผู้ชาย → me:"ผม", end:"ครับ", ask:"ครับ" */
  me: "ผม", name: "เธอ", end: "ครับ", ask: "ครับ",

  /* tint = สีพื้นหลังของฉาก (0 พีช, 1 ลาเวนเดอร์, 2 เหลืองครีม, 3 ชมพู) */
  beats: [
    { tag: "ถึง{name} 💌", img: "intro", tint: 0,
      msg: "สวัสดี{end} 🌷\nมีเรื่องที่อยากบอก{name}...",
      btn: "ต่อไป 👉", hint: "แตะที่น้องแมวดูสิ 👆" },
    { tag: "สิ่งที่แอบคิดมาตลอด", img: "feelings", tint: 1,
      msg: "{name}สวยน่ารักมากเลยนะ ✨",
      btn: "ต่อไป 👉" },
    { tag: "ความในใจ", img: "hug", tint: 2,
      msg: "{me}อยากเป็นคนพิเศษสำหรับ{name}{end} 💕",
      btn: "ต่อไป 👉" },
    { tag: "ขอถามหน่อยนะ{end}", img: "worry", tint: 1,
      msg: "ขอจีบ{name}ได้ไหม{ask}? 🥺",
      btn: "ได้สิ 😊" },
    { tag: "แล้วถ้าจีบแล้ว...", img: "question", tint: 3,
      msg: "{name}จะตกลงเป็นแฟนกันไหม{ask}? ❤️",
      yes: "❤️ ตกลง", no: "😝 ขอคิดก่อน", hint: "(ปุ่มสีเทากดไม่ได้นะ 🏃)" },
    { tag: "ดีใจที่สุดเลย 🎉", img: "ending", tint: 3,
      msg: "ขอบคุณนะ{end} 💕\nจากนี้ขอดูแล{name}ให้ดีที่สุดเลย{end}",
      foot: "📷 แคปหน้านี้ส่งมาให้หน่อยน้าา" }
  ],
  petLines: { 3: "น้องแมวชอบมากเลย 🥰", 7: "เอ๊ะ จะเขินแล้วนะ 😳", 12: "อย่าแตะเยอะนะ เดี๋ยวติดใจ 😽" },
  /* ข้อความใต้ปุ่ม เปลี่ยนทุกครั้งที่ปุ่มสีเทาหนี */
  dodgeHints: ["จับไม่ได้หรอก 😝", "ช้าไปน้าา 🏃", "ใจดีกับ{me}หน่อยน้าา 🥺", "กดปุ่มสีชมพูดีกว่านะ{end} 🥺", "ปุ่มนี้ขี้อายมาก 🙈"],
  /* ปล่อยว่างไว้ = ใช้ GIF แมวที่ฝังในไฟล์ / ใส่ path หรือ URL เพื่อเปลี่ยนเป็นรูปอื่น */
  images: { intro: "", feelings: "", hug: "", worry: "", question: "", ending: "", dodge: "" }
};
/* ============================================================ */

addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const app = $('app'), say = $('say'), msg = $('msg'), bubble = $('bubble'), cat = $('cat'), catbox = $('catbox'),
        actions = $('actions'), hint = $('hint'), hearts = $('hearts'), sr = $('sr');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const fill = s => String(s).replace(/\{(\w+)\}/g, (_, k) => CONFIG[k] ?? '');
  const src = k => CONFIG.images[k] || (window.IMG && IMG[k]) || '';
  let i = 0, dodges = 0, busy = 0, pets = 0, noBtn = null, yesBtn = null, yesScale = 1, typer = null, finishType = null;
  cat.onerror = () => { cat.style.visibility = 'hidden'; };

  /* ฉากหลัง: ดาว + เมฆลอย */
  const sky = $('sky');
  for (let k = 0; k < 34; k++) {
    const s = el('i', 'st'), z = 1.5 + Math.random() * 2.5;
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${z}px;height:${z}px;animation-delay:${Math.random() * 3}s;animation-duration:${2 + Math.random() * 3}s`;
    sky.append(s);
  }
  [[8, 110, 46, 0], [26, 80, 38, -35], [52, 140, 52, -70], [74, 90, 40, -20]].forEach(([top, w, d, delay]) => {
    const c = el('i', 'cl'); c.style.cssText = `top:${top}%;width:${w}px;animation-duration:${d * 2}s;animation-delay:${delay}s`; sky.append(c);
  });
  CONFIG.beats.forEach(() => hearts.append(el('i', '', '♥')));

  /* พิมพ์ข้อความทีละตัว (แตะที่กรอบคำพูดเพื่อข้าม) */
  function typeText(text, done) {
    clearInterval(typer);
    const chars = Array.from(text), a = el('span'), b = el('span', 'ghost');
    msg.replaceChildren(a, b);
    finishType = () => { clearInterval(typer); typer = null; finishType = null; a.textContent = text; b.textContent = ''; done(); };
    if (reduce) { finishType(); return; }
    b.textContent = text;
    let n = 0; const step = Math.max(1, Math.ceil(chars.length / 55));
    typer = setInterval(() => {
      n = Math.min(chars.length, n + step);
      a.textContent = chars.slice(0, n).join(''); b.textContent = chars.slice(n).join('');
      if (n >= chars.length) finishType();
    }, 28);
  }
  bubble.addEventListener('click', () => finishType && finishType());

  function render() {
    const s = Object.fromEntries(Object.entries(CONFIG.beats[i]).map(([k, v]) => [k, typeof v === 'string' && !['img'].includes(k) ? fill(v) : v]));
    $('tag').textContent = s.tag; sr.textContent = s.tag + ' — ' + s.msg;
    [...hearts.children].forEach((h, k) => h.className = k < i ? 'done' : k === i ? 'on' : '');
    document.querySelectorAll('.tints i').forEach((t, k) => t.classList.toggle('on', k === (s.tint || 0)));
    hint.textContent = s.hint || '';
    cat.style.visibility = ''; cat.src = src(s.img);
    cat.style.animation = 'none'; cat.offsetWidth; cat.style.animation = '';
    bubble.style.animation = 'none'; bubble.offsetWidth; bubble.style.animation = '';
    actions.replaceChildren(); actions.classList.add('wait'); noBtn = null; yesBtn = null; yesScale = 1;
    if (s.yes) {
      yesBtn = el('button', 'btn', s.yes); yesBtn.type = 'button'; yesBtn.onclick = e => { cheer(e); next(); };
      noBtn = el('button', 'btn no', s.no); noBtn.type = 'button'; noBtn.setAttribute('aria-disabled', 'true');
      ['pointerenter', 'pointerdown', 'focus', 'click'].forEach(ev => noBtn.addEventListener(ev, e => { e.preventDefault(); dodge(); }));
      actions.append(yesBtn, noBtn);
    } else if (s.btn) { const b = el('button', 'btn', s.btn); b.type = 'button'; b.onclick = next; actions.append(b); }
    else {
      actions.append(el('div', 'foot', s.foot));
      const r = el('button', 'again', '↻ ดูอีกรอบ'); r.type = 'button'; r.onclick = () => { i = 0; dodges = 0; fade(render); }; actions.append(r);
    }
    typeText(s.msg, () => actions.classList.remove('wait'));
    if (i === CONFIG.beats.length - 1) finale();
  }
  function fade(fn) { app.classList.add('out'); setTimeout(() => { fn(); app.classList.remove('out'); }, 240); }
  function next() { fade(() => { i++; render(); }); }
  function cheer(e) { const r = e.currentTarget.getBoundingClientRect(); sparkleAt(r.left + r.width / 2, r.top + r.height / 2, 14); confetti(36, r.left + r.width / 2, r.top, 7); }

  /* ลูบน้องแมว */
  catbox.addEventListener('pointerdown', e => {
    if (e.target !== cat) return;
    pets++; catbox.classList.remove('squish'); catbox.offsetWidth; catbox.classList.add('squish');
    sparkleAt(e.clientX, e.clientY, 8);
    const line = CONFIG.petLines[pets];
    if (line && !noBtn) hint.textContent = line;
  });

  /* ปุ่ม "ขอคิดก่อน" วิ่งหนีอยู่แถวๆ ปุ่ม ไม่ไปไกล */
  function dodge() {
    if (!noBtn || Date.now() - busy < 200) return; busy = Date.now();
    yesScale = Math.min(1.4, yesScale + .07); yesBtn.style.setProperty('--s', yesScale);
    cat.classList.remove('shk'); catbox.classList.remove('squish'); catbox.offsetWidth; catbox.classList.add('squish');
    const r = noBtn.getBoundingClientRect();
    if (!noBtn.classList.contains('fly')) {
      const ph = el('span'); ph.style.cssText = `width:${r.width}px;height:${r.height}px`; actions.append(ph);
      noBtn.style.left = r.left + 'px'; noBtn.style.top = r.top + 'px';
      noBtn.classList.add('fly'); noBtn.offsetWidth;
    }
    popSticker(r);
    const y = yesBtn.getBoundingClientRect(), a = app.getBoundingClientRect(), ac = actions.getBoundingClientRect(), W = innerWidth, H = innerHeight, m = 10;
    const left = Math.max(10, a.left + 10), right = Math.min(W - 10, a.right - 10), bottom = Math.min(H - 10, ac.bottom + 36);
    const free = (x, t) => x + r.width < y.left - m || x > y.right + m || t + r.height < y.top - m || t > y.bottom + m;
    let best = null;
    for (const top of [ac.top - 24, ac.top - 130]) {
      for (let n = 0; n < 60; n++) {
        const cx = left + Math.random() * Math.max(0, right - left - r.width), cy = top + Math.random() * Math.max(0, bottom - top - r.height);
        if (!free(cx, cy)) continue;
        const d = Math.hypot(cx - r.left, cy - r.top);
        if (d >= 50 && d <= 200) { best = [cx, cy]; break; }
        if (!best || (d >= 50 && Math.abs(d - 120) < best[2])) best = [cx, cy, Math.abs(d - 120)];
      }
      if (best) break;
    }
    if (best) { noBtn.style.left = best[0] + 'px'; noBtn.style.top = best[1] + 'px'; }
    hint.textContent = fill(CONFIG.dodgeHints[dodges++ % CONFIG.dodgeHints.length]);
  }
  function popSticker(r) {
    const p = el('img', 'pop'); p.alt = ''; p.src = src('dodge');
    p.style.left = r.left + r.width / 2 - 36 + 'px'; p.style.top = r.top - 56 + 'px';
    document.body.append(p); setTimeout(() => p.remove(), 800);
  }
  addEventListener('pointermove', e => {
    if (!noBtn || e.pointerType === 'touch') return;
    const r = noBtn.getBoundingClientRect();
    if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < 80) dodge();
  });
  addEventListener('resize', () => {
    if (!noBtn || !noBtn.classList.contains('fly')) return;
    const r = noBtn.getBoundingClientRect();
    noBtn.style.left = Math.min(Math.max(10, r.left), innerWidth - r.width - 10) + 'px';
    noBtn.style.top = Math.min(Math.max(10, r.top), innerHeight - r.height - 10) + 'px';
  });

  /* ประกาย / ของลอย / คอนเฟตติ */
  const sparks = [['♥', '#ff9eb5'], ['✦', '#ffb38a'], ['★', '#ffd966'], ['♥', '#ffc9d6'], ['🐾', '']];
  function sparkleAt(x, y, n) {
    if (reduce) return;
    for (let k = 0; k < n; k++) {
      const [ch, col] = sparks[Math.random() * sparks.length | 0], s = el('span', 'sparkle', ch), a = Math.random() * 6.283, d = 28 + Math.random() * 44;
      s.style.cssText = `left:${x}px;top:${y}px;color:${col};font-size:${11 + Math.random() * 11}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 14}px`;
      document.body.append(s); setTimeout(() => s.remove(), 850);
    }
  }
  addEventListener('pointerdown', e => { if (e.target !== cat) sparkleAt(e.clientX, e.clientY, 5); });
  const bits = [['♥', '#ff9eb5'], ['♥', '#ffc9d6'], ['✦', '#ffd6a8'], ['🐾', ''], ['🍑', ''], ['🌸', '']];
  function spawn() {
    if (document.hidden) return;
    const [ch, col] = bits[Math.random() * bits.length | 0], f = el('span', 'fall', ch);
    f.style.cssText = `left:${Math.random() * 100}vw;color:${col};font-size:${10 + Math.random() * 14}px;opacity:${.5 + Math.random() * .45};--sw:${(Math.random() - .5) * 90}px;animation-duration:${6 + Math.random() * 5}s`;
    document.body.append(f); setTimeout(() => f.remove(), 11500);

  if (!reduce) setInterval(spawn, 700);
  function finale() { for (let k = 0; k < 40; k++) setTimeout(spawn, k * 50); wave(); }

  const cv = $('confetti'), cx = cv.getContext('2d'); let parts = [], raf = 0;

  size(); addEventListener('resize', size);
  const cols = ['#ffb3c1', '#ffd6a8', '#ffffff', '#d9d4e8', '#ff9eb5', '#ffe9a8', '#b8e0d2'];
  function confetti(n, ox, oy, power, dir) {
    if (reduce) return;
    for (let k = 0; k < n; k++) {
      const a = dir == null ? Math.random() * 6.283 : dir + (Math.random() - .5) * .9, v = power * (.4 + Math.random() * .8);
      parts.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (dir == null ? 3 : 0), r: Math.random() * 6, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 7, c: cols[Math.random() * cols.length | 0], t: Math.random() * 3 | 0 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 30);
    for (const p of parts) {
      p.vy += .22; p.vx *= .985; p.vy *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      if (p.t === 0) cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      else { cx.font = p.s * 1.8 + 'px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(p.t === 1 ? '♥' : '★', 0, 0); }
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }
  function wave() {
    [0, 450, 900].forEach(d => setTimeout(() => {
      confetti(34, innerWidth * .08, innerHeight, 15, -1.15);
      confetti(34, innerWidth * .92, innerHeight, 15, -2);
      confetti(30, innerWidth / 2, innerHeight * .3, 6);
    }, d));
  }
  render();
});
